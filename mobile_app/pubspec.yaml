name: aware_campus_navigation
description: "Aware Campus Navigation — Accessibility-aware mobile navigation for Mewar University and Kumbha Hostel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/kumbah-ground-floor.png
    - assets/data/mewar_locations.json
    - assets/data/mewar_indoor.json
